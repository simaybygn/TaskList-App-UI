<!-- Edit Form -->
<div class="flex items-start gap-4 p-4" *ngIf="edit">
  <!-- Form for updating task description -->
  <form class="flex w-full items-center gap-4">
    <!-- Text input for task description -->
    <input
      type="text"
      [(ngModel)]="model.description"
      name="description"
      required
      class="flex-1 px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-gray-500"
    />

    <!-- Save button to update task description -->
    <button
      (click)="updateTaskDescription()"
      type="submit"
      class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-900 transition"
    >
      Save
    </button>

    <!-- Cancel button to exit edit mode -->
    <button
      type="button"
      (click)="changeEditModeStatus(false)"
      class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition"
    >
      Cancel
    </button>
  </form>
</div>

<!-- Task Card View -->
<div class="flex items-center justify-between p-2 pr-4 pl-4" *ngIf="!edit">
  <!-- Completion status toggle button -->
  <div class="pr-6">
    <button
      (click)="updateTaskCompleteStatus()"
      class="flex items-center justify-center w-8 h-8 rounded-full border-2 transition"
      [ngClass]="{
        'bg-green-600 border-green-600 text-white': task.isCompleted,
        'border-green-600 text-green-600': !task.isCompleted
      }"
    >
      <mat-icon>check</mat-icon>
    </button>
  </div>

  <!-- Task description text -->
  <span
  [matTooltip]="(task.description && task.description.length > 90) ? task.description : ''"
  matTooltipPosition="above"
   class="flex-1 truncate ...">
    {{ task.description }}
  </span>

  <!-- Action buttons: Edit and Delete -->
  <div class="flex gap-2">
    <!-- Edit button -->
    <button
      (click)="changeEditModeStatus(true)"
      class="flex items-center justify-center w-8 h-8 bg-white rounded-full border border-gray-400 hover:border-gray-600 transition"
    >
      <mat-icon class="text-gray-700">edit</mat-icon>
    </button>

    <!-- Delete button -->
    <button
      (click)="deleteTask()"
      class="flex items-center justify-center w-8 h-8 bg-white rounded-full border border-red-400 hover:border-red-600 transition"
    >
      <mat-icon class="text-red-600">delete</mat-icon>
    </button>
  </div>
</div>
