<!-- Header Section with sticky top and title -->
<header class="bg-black py-4 text-center sticky top-0 z-20">
  <h1 class="text-2xl font-bold text-white">Task List</h1>
</header>

<!-- Main Content Area -->
<main class="flex flex-col items-center p-4 pt-0 w-full">

  <!-- Spacer div to handle sticky header spacing -->
  <div class="bg-white w-full sticky top-20 z-20 h-8"></div>

  <!-- Form container and filter buttons wrapper -->
  <div class="bg-white w-full sticky top-28 z-20 mb-2 [box-shadow:0_4px_6px_-4px_rgba(0,0,0,0.1)]">

    <!-- Add New Task Form -->
    <div class="w-1/2 mx-auto p-4 border border-gray-300 rounded shadow-sm mb-6">
      <form class="flex gap-2" (ngSubmit)="createTask()" #taskForm="ngForm">
        <!-- Input for new task description -->
        <input
          type="text"
          name="newTask"
          placeholder="Add new task..."
          required
          class="flex-1 px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-gray-500"
          [(ngModel)]="newTaskDescription"
        />
        <!-- Submit button to add the task -->
        <button
          type="submit"
          class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-900 transition"
        >
          Add
        </button>
      </form>
    </div>

    <!-- Filter Buttons to show all, active, or completed tasks -->
    <div class="w-1/2 mx-auto flex justify-center gap-4 mb-4">
      <button
        (click)="setFilter('all')"
        [ngClass]="{'bg-gray-900 text-white': currentFilter === 'all', 'bg-gray-200 text-black': currentFilter !== 'all'}"
        class="px-4 py-2 rounded transition hover:bg-gray-700 hover:text-white"
      >
        All
      </button>
      <button
        (click)="setFilter('active')"
        [ngClass]="{'bg-gray-900 text-white': currentFilter === 'active', 'bg-gray-200 text-black': currentFilter !== 'active'}"
        class="px-4 py-2 rounded transition hover:bg-gray-700 hover:text-white"
      >
        Active
      </button>
      <button
        (click)="setFilter('completed')"
        [ngClass]="{'bg-gray-900 text-white': currentFilter === 'completed', 'bg-gray-200 text-black': currentFilter !== 'completed'}"
        class="px-4 py-2 rounded transition hover:bg-gray-700 hover:text-white"
      >
        Completed
      </button>
    </div>

  </div>

  <!-- Task List rendered with task-row component for each task -->
  <div class="w-full flex flex-col gap-2 pt-2">
    <task-row
      class="w-1/2 mx-auto border-b border-black"
      *ngFor="let task of taskList"
      [task]="task"
      (taskChanged)="onTaskChanged($event)"
    ></task-row>
  </div>

</main>
